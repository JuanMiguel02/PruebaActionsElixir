name: Elixir Direct Pipeline (no mix)

on: 
    pull_request:
        branches:
            - main

jobs:
    build-and-run:
        name: Compilar y Ejecutar
        runs-on: ubuntu-latest

        steps:
            - name: Checkout del código
              uses: actions/checkout@v4

            - name: Configurar BEAM (Erlang y Elixir)
              uses: erlef/setup-beam@v1
              with:
                elixir-version: '1.17'
                otp-version: '26'
            
            - name: Compilar módulos (.ex) a ebin
              run: |
                mkdir -p ebin
                elixirc lib/*.ex -o ebin
            
            - name: Ejecutar script principal (.exs)
              run: |
                elixir -pa ebin scripts/main.exs
            
            - name: Reportar en consola si falló
              if: failure()
              run: |
                echo "::error title=Fallo de Validación::La ejecución de Elixir no pasó las verificaciones."

            - name: Generar Resumen del Job
              if: always()
              run: |
                  echo "##  Reporte de Ejecución - Elixir Direct Pipeline" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                    
                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### Status: ✅ Exitoso" >> $GITHUB_STEP_SUMMARY
                    echo "Todos los módulos de \`lib/*.ex\` compilaron correctamente en \`ebin/\` y \`scripts/main.exs\` pasó la validación." >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### Status: ❌ Fallido" >> $GITHUB_STEP_SUMMARY
                    echo "Ocurrió un error al compilar el código o la aserción en el script de validación falló." >> $GITHUB_STEP_SUMMARY
                  fi